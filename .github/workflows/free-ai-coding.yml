name: Sync free-ai-coding data

# Upstream (awesome-free-ai-coding) re-probes every entry twice a
# week; syncing Tue/Fri mornings (Beijing) keeps /free-ai-coding
# within a few days of its latest verification round. The fetch
# script applies this site's editorial filter; a failed fetch exits
# non-zero and leaves the committed data untouched (no commit made).
on:
  schedule:
    - cron: '17 1 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch + filter upstream index.json
        run: node scripts/fetch-free-ai-coding.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/free-ai-coding.json; then
            echo "No data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/free-ai-coding.json
          git commit -m "chore: sync free-ai-coding data"
          # Cloudflare Pages deploys production from `main` only; a push
          # to master alone would strand the update in a preview build.
          git push origin HEAD:master
          git push origin HEAD:main
